clauses:
  - id: EVPN_M1
    statement: "Two-tenant symmetric-IRB reference fabric"
nodes:
  - {name: spine1, roles: [spine], interfaces: [{name: eth1}, {name: eth2}, {name: eth3}, {name: eth4}]}
  - {name: spine2, roles: [spine], interfaces: [{name: eth1}, {name: eth2}, {name: eth3}, {name: eth4}]}
  - {name: leaf1, roles: [leaf], interfaces: [{name: lo0, addresses: [10.255.0.1/32]}, {name: eth1}, {name: eth2}]}
  - {name: leaf2, roles: [leaf], interfaces: [{name: lo0, addresses: [10.255.0.2/32]}, {name: eth1}, {name: eth2}]}
  - {name: leaf3, roles: [leaf], interfaces: [{name: lo0, addresses: [10.255.0.3/32]}, {name: eth1}, {name: eth2}]}
  - {name: leaf4, roles: [leaf], interfaces: [{name: lo0, addresses: [10.255.0.4/32]}, {name: eth1}, {name: eth2}]}
links:
  - {a: {node: spine1, interface: eth1}, b: {node: leaf1, interface: eth1}}
  - {a: {node: spine1, interface: eth2}, b: {node: leaf2, interface: eth1}}
  - {a: {node: spine1, interface: eth3}, b: {node: leaf3, interface: eth1}}
  - {a: {node: spine1, interface: eth4}, b: {node: leaf4, interface: eth1}}
  - {a: {node: spine2, interface: eth1}, b: {node: leaf1, interface: eth2}}
  - {a: {node: spine2, interface: eth2}, b: {node: leaf2, interface: eth2}}
  - {a: {node: spine2, interface: eth3}, b: {node: leaf3, interface: eth2}}
  - {a: {node: spine2, interface: eth4}, b: {node: leaf4, interface: eth2}}
vlans: [{id: 101, name: tenant-a}, {id: 201, name: tenant-b}]
vrfs: [{name: tenant-a, tenant: a}, {name: tenant-b, tenant: b}, {name: management, tenant: ops, management: true}]
prefix_sets: [{name: default-only, prefixes: [0.0.0.0/0]}]
community_sets: []
route_policies: [{name: tenant-export, terms: [{name: permit-tenant, action: permit}]}]
bgp_sessions:
  - {local_node: leaf1, remote_node: spine1, local_as: 65001, remote_as: 65000, address_families: [ipv4-unicast, l2vpn-evpn], export_policy: tenant-export}
  - {local_node: leaf2, remote_node: spine1, local_as: 65002, remote_as: 65000, address_families: [ipv4-unicast, l2vpn-evpn], export_policy: tenant-export}
  - {local_node: leaf3, remote_node: spine2, local_as: 65003, remote_as: 65000, address_families: [ipv4-unicast, l2vpn-evpn], export_policy: tenant-export}
  - {local_node: leaf4, remote_node: spine2, local_as: 65004, remote_as: 65000, address_families: [ipv4-unicast, l2vpn-evpn], export_policy: tenant-export}
vteps:
  - {node: leaf1, source_interface: lo0, peers: [leaf2, leaf3, leaf4]}
  - {node: leaf2, source_interface: lo0, peers: [leaf1, leaf3, leaf4]}
  - {node: leaf3, source_interface: lo0, peers: [leaf1, leaf2, leaf4]}
  - {node: leaf4, source_interface: lo0, peers: [leaf1, leaf2, leaf3]}
evpn_instances:
  - {name: tenant-a-l2, tenant: a, rd: 65000:101, import_rts: [target:65000:101], export_rts: [target:65000:101]}
  - {name: tenant-b-l2, tenant: b, rd: 65000:201, import_rts: [target:65000:201], export_rts: [target:65000:201]}
  - {name: tenant-a-l3, tenant: a, rd: 65000:10001, import_rts: [target:65000:10001], export_rts: [target:65000:10001]}
l2_vnis:
  - {vni: 10101, vlan: 101, evpn_instance: tenant-a-l2, vtep: leaf1}
  - {vni: 10201, vlan: 201, evpn_instance: tenant-b-l2, vtep: leaf2}
l3_vnis:
  - {vni: 11001, vrf: tenant-a, evpn_instance: tenant-a-l3, vtep: leaf1, symmetric_irb: true}
static_fdb: []
