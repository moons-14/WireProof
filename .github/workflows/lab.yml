name: Lab gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wireproof-lab-${{ github.repository }}
  cancel-in-progress: false

jobs:
  doctor:
    if: >-
      github.repository == 'moons-14/WireProof' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, wireproof-lab]
    environment: lab
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Record and enforce the runtime capability gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .wireproof-ci
          nix develop --command uv run --frozen wireproof lab doctor \
            > .wireproof-ci/doctor.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('.wireproof-ci/doctor.json').read_text())
          if result.get('result') == 'UNKNOWN':
              raise SystemExit('lab doctor returned UNKNOWN; runtime lifecycle is not enabled')
          if result.get('result') != 'PASS':
              raise SystemExit(f"lab doctor returned blocking result: {result.get('result')!r}")
          PY
