[project]
name = "wireproof-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "wireproof-cli",
  "wireproof-capability",
  "wireproof-compiler",
  "wireproof-evidence",
  "wireproof-runtime",
]

[dependency-groups]
dev = ["hypothesis>=6.120,<7", "mypy>=1.14,<2", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.uv.sources]
wireproof-core = { workspace = true }
wireproof-capability = { workspace = true }
wireproof-compiler = { workspace = true }
wireproof-evidence = { workspace = true }
wireproof-runtime = { workspace = true }
wireproof-cli = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["wireproof_core", "wireproof_capability", "wireproof_compiler", "wireproof_evidence", "wireproof_runtime", "wireproof_cli"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
